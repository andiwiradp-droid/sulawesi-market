<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1264d8">
<title>Sulawesi Market</title>
<style>
:root{
  --blue:#1264d8;
  --red:#e53935;
  --bg:#f7f9fc;
  --text:#182235;
  --muted:#7a8190;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:var(--text)}
.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}
header{padding:16px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eee}
.brand{font-size:29px;font-weight:900}
.brand .blue{color:var(--blue)}
.brand .red{color:var(--red)}
.creator{font-size:13px;color:var(--muted);margin-top:4px}
.search{margin-top:14px;background:#eef2f7;border-radius:30px;padding:15px 18px;font-size:18px;color:#9299a6}
.location{padding:28px 32px;border-bottom:1px solid #eee;font-size:22px;font-weight:800;color:#2c5d96}
.hero{margin:28px 32px;background:linear-gradient(135deg,#2475df,#48a0f5);border-radius:30px;padding:30px 38px;color:#fff}
.hero h1{margin:0 0 10px;font-size:30px}
.hero p{margin:0;font-size:18px;line-height:1.35}
.section{padding:0 32px;margin-top:32px}
.section-title{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:800}
.section-title button{border:0;background:none;color:var(--blue);font-size:17px;font-weight:800}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.cat{border:0;background:#f3f6fa;border-radius:22px;padding:16px 5px;text-align:center;font-size:15px;cursor:pointer;min-height:105px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.cat b{font-size:30px;margin-bottom:8px}
.cat:active{transform:scale(.96)}
.cat.active{outline:3px solid #b8d5ff;background:#eaf3ff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;padding-bottom:100px}
.product{background:#edf4ff;border-radius:24px;overflow:hidden;cursor:pointer}
.product-img{height:150px;display:flex;align-items:center;justify-content:center;font-size:62px}
.product-info{background:#fff;padding:12px}
.product-name{font-weight:800;font-size:16px}
.product-price{color:var(--blue);font-weight:800;margin-top:5px}
.empty{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted);background:#f5f7fa;border-radius:20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:76px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:10}
nav button{border:0;background:none;color:#6f7682;font-size:14px}
nav .plus{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span class="blue">SULAWESI</span> <span class="red">MARKET</span></div>
  <div class="creator">Pasarnya Orang Sulawesi · Founder & Creator: Andi Wira Darma</div>
  <div class="search">🔎 &nbsp;Cari HP, mobil, motor, elektronik...</div>
</header>

<div class="location">📍 Palopo, Sulawesi Selatan⌄</div>

<div class="hero">
  <h1>Jual Beli Mudah</h1>
  <p>Temukan barang di sekitar kamu di seluruh Sulawesi.</p>
</div>

<section class="section">
  <div class="section-title">
    <span>Kategori</span>
    <button onclick="showAll()">Lihat semua ›</button>
  </div>

  <div class="cats">
    <button class="cat active" onclick="filterCategory('HP',this)"><b>📱</b>HP</button>
    <button class="cat" onclick="filterCategory('Mobil',this)"><b>🚗</b>Mobil</button>
    <button class="cat" onclick="filterCategory('Motor',this)"><b>🏍️</b>Motor</button>
    <button class="cat" onclick="filterCategory('Laptop',this)"><b>💻</b>Laptop</button>
    <button class="cat" onclick="filterCategory('Properti',this)"><b>🏠</b>Properti</button>
    <button class="cat" onclick="filterCategory('Sparepart',this)"><b>🔧</b>Sparepart</button>
    <button class="cat" onclick="filterCategory('Fashion',this)"><b>👕</b>Fashion</button>
    <button class="cat" onclick="filterCategory('Lainnya',this)"><b>📦</b>Lainnya</button>
  </div>
</section>

<section class="section">
  <div class="section-title"><span>🔥 Barang Terbaru</span></div>
  <div id="products" class="products"></div>
</section>

<nav>
  <button onclick="showAll()">⌂<br>Home</button>
  <button onclick="alert('Fitur pencarian siap dikembangkan')">⌕<br>Cari</button>
  <button class="plus" onclick="alert('Form tambah barang siap dikembangkan')">+</button>
  <button onclick="alert('Chat siap dikembangkan')">💬<br>Chat</button>
  <button onclick="alert('Profil siap dikembangkan')">○<br>Profil</button>
</nav>
</div>

<script>
const data = [
  {category:'HP', name:'HP / Smartphone', icon:'📱', price:'Hubungi penjual'},
  {category:'Mobil', name:'Mobil', icon:'🚗', price:'Hubungi penjual'},
  {category:'Motor', name:'Motor', icon:'🏍️', price:'Hubungi penjual'},
  {category:'Laptop', name:'Laptop', icon:'💻', price:'Hubungi penjual'},
  {category:'Properti', name:'Properti', icon:'🏠', price:'Hubungi penjual'},
  {category:'Sparepart', name:'Sparepart', icon:'🔧', price:'Hubungi penjual'},
  {category:'Fashion', name:'Fashion', icon:'👕', price:'Hubungi penjual'},
  {category:'Lainnya', name:'Barang lainnya', icon:'📦', price:'Hubungi penjual'}
];

function render(items){
  const box=document.getElementById('products');
  if(!items.length){
    box.innerHTML='<div class="empty">Belum ada barang di kategori ini.</div>';
    return;
  }
  box.innerHTML=items.map(x=>`
    <div class="product" onclick="alert('Detail ${x.category}: ${x.name}')">
      <div class="product-img">${x.icon}</div>
      <div class="product-info">
        <div class="product-name">${x.name}</div>
        <div class="product-price">${x.price}</div>
      </div>
    </div>
  `).join('');
}

function filterCategory(category,button){
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
  render(data.filter(x=>x.category===category));
}

function showAll(){
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  render(data);
}

render(data.filter(x=>x.category==='HP'));
</script>
</body>
</html>
